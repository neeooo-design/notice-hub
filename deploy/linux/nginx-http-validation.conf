server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_IP__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Notice Hub deployment is in progress.\n";
    }
}
