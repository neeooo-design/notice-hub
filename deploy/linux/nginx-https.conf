# This site file is included inside nginx's http context.
limit_req_zone $binary_remote_addr zone=noticehub_pages:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=noticehub_assets:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=noticehub_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=noticehub_login:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=noticehub_connections:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __SERVER_IP__;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://__SERVER_IP__$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __SERVER_IP__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__SERVER_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SERVER_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NoticeHubTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 128k;
    limit_req_status 429;
    limit_req_log_level warn;
    limit_conn noticehub_connections 20;
    limit_conn_status 429;
    access_log /var/log/nginx/noticehub.access.log;
    error_log /var/log/nginx/noticehub.error.log warn;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    error_page 429 = @noticehub_rate_limited;
    location @noticehub_rate_limited {
        default_type application/json;
        add_header Retry-After 6 always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        return 429 '{"code":429,"message":"Too many requests. Please try again shortly.","data":null}';
    }

    # Vite filenames contain a content hash; a new build gets new URLs.
    location ^~ /assets/ {
        limit_req zone=noticehub_assets burst=40 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /favicon.svg {
        limit_req zone=noticehub_assets burst=40 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
    }

    location = /api/auth/login {
        limit_req zone=noticehub_login burst=10 nodelay;
        gzip off;
        proxy_pass http://127.0.0.1:8088;
    }

    location ^~ /api/ {
        limit_req zone=noticehub_api burst=20 nodelay;
        gzip off;
        proxy_pass http://127.0.0.1:8088;
    }

    # Revalidate HTML so a browser discovers new asset hashes after deployment.
    location / {
        limit_req zone=noticehub_pages burst=10 nodelay;
        proxy_pass http://127.0.0.1:8088;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache";
    }
}
